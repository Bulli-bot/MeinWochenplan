<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeinWochenplan – Prototyp</title>
<style>
:root{
  --bg:#0b0f0d; --bg2:#121815; --card:#161d19; --card2:#1b2420; --line:#243029; --line2:#33423a;
  --text:#e8efe9; --muted:#9db0a4; --faint:#6f8478;
  --acc:#22c55e; --acc2:#16a34a; --accSoft:#173a25; --onAcc:#04140a;
  --warn:#f5b84b; --warnSoft:#3a2d12; --red:#f2706a; --redSoft:#3b1d1b; --blue:#6aa9f5; --blueSoft:#172a40; --violet:#b9a3f5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050706;color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}

/* ---------- Prototyp-Rahmen ---------- */
.proto-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:#0e1411;border-bottom:1px solid var(--line)}
.proto-bar strong{margin-right:auto;font-size:15px}
.proto-bar button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px}
.proto-bar button.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.proto-bar .info{color:var(--muted);font-size:12px;min-width:150px;text-align:right}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:hidden}
.device-wrap{transform-origin:top left}
.device{container-type:inline-size;container-name:dev;background:var(--bg);border:1px solid var(--line2);border-radius:18px;overflow:hidden;position:relative}

/* ---------- App-Gerüst (reagiert auf die Gerätebreite per Container Query) ---------- */
.app{display:grid;height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "tabs"}
.sidebar{grid-area:side;display:none}
.main{grid-area:main;overflow:auto;padding:18px 16px 28px;container-type:inline-size;container-name:main}
/* Handy und Tablet: Inspektor als Slide-over von rechts */
.inspector{grid-area:insp;display:block;position:absolute;top:0;right:0;bottom:0;width:100%;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;z-index:20;overflow:auto;padding:20px}
.inspector.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.45)}
.pane3{grid-area:pane;display:none}
.tabbar{grid-area:tabs;display:flex;justify-content:space-around;background:var(--bg2);border-top:1px solid var(--line);padding:6px 0 10px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);min-width:52px;min-height:48px;padding:4px}
.tabbar button.on{color:var(--acc);font-weight:700}
.drawer-btn{display:inline-flex}

@container dev (min-width:768px){
  .app{grid-template-columns:72px minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"side main"}
  .tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;background:var(--bg2);border-right:1px solid var(--line)}
  .sidebar .lbl,.sidebar .side-extra{display:none}
  .main{padding:24px}
  .inspector{width:380px;max-width:85%}
}
@container dev (min-width:1200px){
  .app{grid-template-columns:240px minmax(0,1fr) 400px;grid-template-areas:"side main insp"}
  .sidebar{align-items:stretch;padding:20px 14px}
  .sidebar .lbl,.sidebar .side-extra{display:initial}
  .sidebar .side-extra{display:block}
  .inspector{position:static;transform:none;width:auto;max-width:none;box-shadow:none;z-index:auto}
  .drawer-btn{display:none}
}
@container dev (min-width:1920px){
  .app{grid-template-columns:260px minmax(0,1fr) 400px 380px;grid-template-areas:"side main pane insp"}
  .pane3{display:block;background:var(--bg2);border-left:1px solid var(--line);overflow:auto;padding:20px}
  .inspector{border-left:1px solid var(--line)}
}

/* ---------- Bausteine ---------- */
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--muted);border-radius:12px;padding:11px 12px;width:100%;font-size:14px;text-align:left}
.nav-btn:hover{background:var(--card)}
.nav-btn.on{background:var(--accSoft);color:var(--text);font-weight:700}
.nav-btn.on svg{stroke:var(--acc)}
@container dev (max-width:1199px){.nav-btn{width:48px;height:48px;justify-content:center;padding:0}}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 6px 18px}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:26px;letter-spacing:-.4px}
h2{margin:0;font-size:18px}
h3{margin:0;font-size:15px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.row>div{min-width:0}
.head>.grow{min-width:220px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--acc);color:var(--onAcc);min-height:44px}
.btn.sec{background:var(--accSoft);color:var(--acc)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.chip.warn{border-color:#6b5320;background:var(--warnSoft);color:var(--warn)}
.chip.add{border-style:dashed;color:var(--acc)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--line2);color:var(--text);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:11.5px;font-weight:600;background:var(--bg2);color:var(--muted)}
.tag.g{background:var(--accSoft);color:#7ee2a3}.tag.b{background:var(--blueSoft);color:var(--blue)}.tag.y{background:var(--warnSoft);color:var(--warn)}.tag.r{background:var(--redSoft);color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.section-t{font-size:11.5px;font-weight:700;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;margin:16px 0 8px}
.stack{display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);border-radius:14px;padding:12px 16px;font-weight:600;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Woche ---------- */
.week{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@container dev (min-width:768px){.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container main (min-width:700px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container main (min-width:1100px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.day.today{border-color:var(--acc)}
.day.done{opacity:.6}
.day.over{outline:2px dashed var(--acc);outline-offset:2px}
.day.rest{border-style:dashed;border-color:var(--blue)}
.day .art{height:78px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.day .name{font-weight:700;font-size:13.5px;line-height:1.25;min-height:34px}
.ppl{display:flex;gap:4px;flex-wrap:wrap}
.tinput{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:3px 4px;font-size:12px;color-scheme:dark;width:76px}
.tinput.own{border-color:var(--acc);color:var(--acc);font-weight:700}
.ppl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--accSoft);color:#7ee2a3;font-size:10.5px;font-weight:800;padding:0}
.ppl button.off{background:transparent;color:var(--faint);text-decoration:line-through}
.bridge{position:absolute;left:-12px;top:50%;width:14px;border-top:2px dashed var(--blue)}
.dayhead{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.mini-actions{display:flex;gap:6px}
.mini-actions button{flex:1;border:0;border-radius:9px;background:var(--accSoft);color:var(--acc);font-size:11.5px;font-weight:700;padding:7px 4px}

/* ---------- Rezepte (Master-Detail) ---------- */
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container main (min-width:720px){.split{grid-template-columns:minmax(260px,.85fr) minmax(0,1.4fr)}}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;text-align:left;width:100%}
.ritem.on{border-color:var(--acc);background:var(--accSoft)}
.ritem .thumb{width:46px;height:46px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-hero{height:190px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.timeline{display:flex;flex-direction:column;gap:6px}
.tl{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;font-size:13px}
.tl b{color:var(--acc)}
.tlbar{height:6px;border-radius:3px;background:var(--blue);opacity:.7;margin-top:4px}
.back-btn{display:none}
@container main (max-width:719px){.split.has-sel .rlist-wrap{display:none}.split:not(.has-sel) .rdetail{display:none}.back-btn{display:inline-flex}}

/* ---------- Einkauf ---------- */
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px}
.item.done{opacity:.5}
.item.done .iname{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.item.done .check{background:var(--acc);border-color:var(--acc)}
.iname{font-weight:700;font-size:14.5px}
.trend-up{color:var(--red);font-size:12px;font-weight:700}
.trend-down{color:var(--acc);font-size:12px;font-weight:700}
.shopcols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container main (min-width:900px){.shopcols.split-on{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- Zero-Waste ---------- */
.heat{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container main (min-width:640px){.heat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.heatcol{border-radius:16px;padding:12px;border:1px solid var(--line)}
.heatcol.r{background:#231312;border-color:#5a2724}.heatcol.y{background:#221c0d;border-color:#5a4718}.heatcol.g{background:#0f1f15;border-color:#1f4a2d}
.food{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);margin-top:6px;font-size:13.5px}

/* ---------- Abstimmung ---------- */
.deck{position:relative;height:430px;max-width:420px;margin:0 auto}
.vcard{position:absolute;inset:0;border-radius:22px;background:var(--card);border:1px solid var(--line2);overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab;transition:transform .25s ease}
.vcard.dragging{transition:none;cursor:grabbing}
.vcard .art{flex:1;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.vcard .stamp{position:absolute;top:20px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:18px;border:3px solid;opacity:0}
.vbtns{display:flex;justify-content:center;gap:16px;margin-top:14px}
.vbtns button{width:62px;height:62px;border-radius:50%;border:2px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* ---------- Ausgaben ---------- */
.bonsplit{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container main (min-width:760px){.bonsplit{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.receipt-view{height:380px;border-radius:14px;background:#1b1f1c;overflow:hidden;position:relative}
.receipt{position:absolute;left:50%;top:16px;width:220px;margin-left:-110px;background:#f3f1ea;color:#222;font:12px/1.55 "Courier New",monospace;padding:16px 14px;border-radius:2px;transform-origin:top center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.bonrow{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.bonrow select{background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:4px}
.dot{width:10px;height:10px;border-radius:50%}
.burn{display:flex;align-items:flex-end;gap:18px;height:180px;padding:0 6px;border-bottom:1px solid var(--line);position:relative}
.burn .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px}
.burn .b{width:100%;border-radius:8px 8px 0 0}

/* ---------- Kochmodus ---------- */
.cook{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column}
.cook .top{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--bg2);border-bottom:1px solid var(--line)}
.cook .body{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:900px;width:100%;margin:0 auto}
.cook .step{font-size:clamp(22px,3cqi,36px);line-height:1.35;font-weight:700}
.cook .timer{font-size:48px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.cook video{width:160px;border-radius:12px;transform:scaleX(-1);border:1px solid var(--line2)}
.cook .foot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg2)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:35;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.modal input{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:10px 12px}
.ring{width:84px;height:84px}
</style>
</head>
<body>
<div class="proto-bar" role="toolbar" aria-label="Gerätebreite">
  <strong>MeinWochenplan · interaktiver Entwurf</strong>
  <button data-vp="390">📱 Mobile (390px)</button>
  <button data-vp="820">📱 Tablet (820px)</button>
  <button data-vp="1440" class="on">🖥️ Desktop 27" (1440px)</button>
  <button data-vp="2560">🖥️ Ultrawide (2560px)</button>
  <button data-vp="fit">↔ Fensterbreite</button>
  <span class="info" id="vpinfo"></span>
</div>
<div class="stage" id="stage">
  <div class="device-wrap" id="wrap">
    <div class="device" id="device">
      <div class="app" id="app">
        <nav class="sidebar" aria-label="Hauptmenü" id="sidebar"></nav>
        <main class="main" id="main"></main>
        <aside class="pane3" id="pane3" aria-label="Live-Einkaufszettel"></aside>
        <aside class="inspector" id="inspector" aria-label="Kontext"></aside>
        <nav class="tabbar" id="tabbar" aria-label="Hauptmenü"></nav>
      </div>
    </div>
  </div>
</div>

      ing:[[.5,'Stk','Pizzateig','Kühlregal'],[50,'g','Kochschinken','Kühlregal'],[50,'g','Mais','Trockensortiment'],[50,'g','Gouda','Kühlregal']],

  },

  ],
  budget:100, spent:88.07, mealTime:'18:30',
  shop:[
    {id:1,name:'Eistee',amt:'3 × 6×1,5 l',store:'Trinkgut',zone:'Drogerie & Getränke',price:4.74,qty:3,deposit:1.50},

/* ---------- Kochmodus mit Sprache und Gesten ---------- */
const C={open:false,r:null,i:0,end:null,paused:null,voice:null,gesture:null};
function renderCook(){
  let el=$('#cook');
  if(!C.open){el&&el.remove();return}
  if(!el){el=document.createElement('div');el.id='cook';el.className='cook';$('#device').appendChild(el)}
  const r=S.recipes[C.r];const [txt,min]=r.steps[C.i];
  const left=C.end?Math.max(0,Math.round((C.end-(C.paused??Date.now()))/1000)):null;
  el.innerHTML=`<div class="top"><div class="grow"><div class="hint">${esc(r.name)} · Essen um ${C.eat} · los um ${startAt(C.eat,r)}</div><h2>Schritt ${C.i+1} von ${r.steps.length}</h2></div>
    <button class="chip ${C.voice?'on':''}" data-act="voice">🎙 Sprache</button><button class="chip ${C.gesture?'on':''}" data-act="gesture">✋ Gesten</button><button class="btn ghost" data-act="cookclose">Schließen</button></div>
    <div class="body"><div class="step">${esc(txt)}</div>
      <div class="row wrap"><button class="btn sec" data-act="timer" data-m="${min}">Timer ${min} Min.</button>${C.end?`<span class="timer">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span><button class="btn ghost" data-act="pause">${C.paused?'Weiter':'Pause'}</button>`:''}</div>
      <div class="hint">Steuerung: Pfeiltasten ← → · Sprache: „weiter“, „zurück“, „Timer stopp“ · Gesten: Hand nach rechts/links wischen, flache Hand vor die Kamera = Timer pausieren.</div>
      ${C.gesture?'<video id="gcam" autoplay muted playsinline></video><div class="hint" id="gstate">Kamera aktiv – Bewegung wird ausgewertet (nichts wird gespeichert).</div>':''}
    </div>
    <div class="foot"><button class="btn ghost" data-act="cprev" style="flex:1">‹ Zurück</button><button class="btn" data-act="cnext" style="flex:2">${C.i===r.steps.length-1?'Fertig':'Weiter ›'}</button></div>`;
  if(C.gesture&&C.gesture.stream){const v=$('#gcam');if(v&&v.srcObject!==C.gesture.stream)v.srcObject=C.gesture.stream}
}
function cookMove(d){const r=S.recipes[C.r];if(!r)return;const n=C.i+d;if(n>=r.steps.length){C.open=false;stopVoice();stopGesture();toast('Guten Appetit! Als gekocht markiert.');return}C.i=Math.max(0,n);renderCook()}
function togglePause(){if(!C.end)return;if(C.paused){C.end+=Date.now()-C.paused;C.paused=null}else C.paused=Date.now();renderCook()}
setInterval(()=>{if(C.open&&C.end&&!C.paused){renderCook();if(C.end<=Date.now()){C.end=null;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}toast('Timer fertig!')}}},1000);

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Spracherkennung gibt es in diesem Browser nicht (Chrome/Edge nutzen).');return}
  const rec=new SR();rec.lang='de-DE';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.toLowerCase();if(t.includes('weiter'))cookMove(1);else if(t.includes('zurück'))cookMove(-1);else if(t.includes('stopp')||t.includes('stop')||t.includes('pause'))togglePause()};
  rec.onend=()=>{if(C.voice)try{rec.start()}catch(e){}};
  try{rec.start();C.voice=rec}catch(e){toast('Mikrofon nicht freigegeben.')}
  renderCook();
}
function stopVoice(){if(C.voice){const r=C.voice;C.voice=null;try{r.stop()}catch(e){}}}

/* Gesten: Bewegungsschwerpunkt in einem 64×48-Bild; schnelle Verschiebung = Wischen, starke Abdunklung = flache Hand */
async function startGesture(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240}});
    const cv=document.createElement('canvas');cv.width=64;cv.height=48;const cx=cv.getContext('2d',{willReadFrequently:true});
    const vid=document.createElement('video');vid.srcObject=stream;vid.muted=true;vid.playsInline=true;await vid.play();
    let prev=null,track=[],cool=0,base=null;
    const loop=()=>{if(!C.gesture)return;cx.drawImage(vid,0,0,64,48);const d=cx.getImageData(0,0,64,48).data;let sx=0,n=0,lum=0;const cur=new Uint8Array(64*48);
      for(let i=0;i<64*48;i++){const g=(d[i*4]+d[i*4+1]+d[i*4+2])/3;cur[i]=g;lum+=g;if(prev&&Math.abs(g-prev[i])>38){sx+=i%64;n++}}
      lum/=64*48;base=base===null?lum:base*.97+lum*.03;prev=cur;const now=Date.now();
      if(now>cool){
        if(n>120){track.push([now,sx/n]);track=track.filter(t=>now-t[0]<600);if(track.length>4){const dx=track[track.length-1][1]-track[0][1];if(Math.abs(dx)>22){cookMove(dx<0?1:-1);track=[];cool=now+1200}}}
        if(lum<base*.45){togglePause();cool=now+2000;base=lum}
      }
      requestAnimationFrame(loop)};
    C.gesture={stream};renderCook();loop();
  }catch(e){toast('Kamera nicht verfügbar oder nicht freigegeben.')}
}
function stopGesture(){if(C.gesture){C.gesture.stream.getTracks().forEach(t=>t.stop());C.gesture=null}}

/* ---------- Leer-Scan (Barcode) ---------- */
const SCAN={open:false,msg:'',stream:null};
function renderScan(){
  let el=$('#scanbox');
  if(!SCAN.open){el&&el.remove();if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}return}
  if(!el){el=document.createElement('div');el.id='scanbox';el.className='modal';$('#device').appendChild(el)}
  el.innerHTML=`<div class="box" role="dialog" aria-label="Leer-Scan"><h2>Leer-Scan</h2><div class="hint">Leere Packung an die Kamera halten – der Artikel wird im Vorrat genullt und landet auf der Einkaufsliste. Unbekannte Codes fragt die App bei OpenFoodFacts nach.</div>
    ${'BarcodeDetector' in window?'<video id="scancam" autoplay muted playsinline style="width:100%;border-radius:12px"></video>':'<div class="hint" style="color:var(--warn)">Kamera-Scan gibt es nur in Chrome/Edge auf Android. Hier: Code eintippen.</div>'}
    <label class="hint" for="ean">EAN-13</label><input id="ean" inputmode="numeric" placeholder="z. B. 4000140712007" value="">
    <div class="row"><button class="btn grow" data-act="ean">Nachschlagen</button><button class="btn ghost" data-act="scanclose">Schließen</button></div>
    <div class="hint" id="scanmsg">${esc(SCAN.msg)}</div></div>`;
  if('BarcodeDetector' in window&&!SCAN.stream){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(st=>{SCAN.stream=st;const v=$('#scancam');if(v){v.srcObject=st;const det=new BarcodeDetector({formats:['ean_13','ean_8']});const tick=async()=>{if(!SCAN.open)return;try{const c=await det.detect(v);if(c[0]){$('#ean').value=c[0].rawValue;lookupEan(c[0].rawValue);return}}catch(e){}setTimeout(tick,300)};tick()}}).catch(()=>{SCAN.msg='Kamera nicht freigegeben – Code eintippen.';renderScan()});
  }
}
async function lookupEan(code){
  SCAN.msg='Suche bei OpenFoodFacts …';$('#scanmsg').textContent=SCAN.msg;
  let name='Artikel '+code;
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands`);const j=await r.json();if(j.product&&j.product.product_name)name=j.product.product_name+(j.product.brands?' ('+j.product.brands.split(',')[0]+')':'')}catch(e){}
  S.shop.push({id:Date.now(),name,amt:'1×',store:'Aldi Süd',zone:'Trockensortiment',price:0,qty:1});
  SCAN.open=false;renderScan();toast(`„${name}“ im Vorrat genullt und auf die Liste gesetzt`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='view'){S.view=b.dataset.v;S.drawer=false;S.selOpen=false}
  else if(a==='drawer')S.drawer=!S.drawer;
  else if(a==='mport'){const m=S.members.find(x=>x.id===b.dataset.m);const steps=[1,.75,.5,1.25];m.p=steps[(steps.indexOf(m.p)+1)%steps.length]}
  else if(a==='madd'){S.members.push({id:'G'+Date.now(),name:'Person '+(S.members.length+1),p:1})}
  else if(a==='ppl'){const d=S.days[+b.dataset.day];const m=b.dataset.m;d.absent=d.absent.includes(m)?d.absent.filter(x=>x!==m):[...d.absent,m]}
  else if(a==='rest'){const d=S.days[+b.dataset.day];d.rest=!d.rest;if(d.rest)return toast(`${d.d}: Reste vom Vortag – Zutaten für „${S.recipes[d.r].name}“ von der Liste genommen`)}
  else if(a==='cookday'){C.open=true;C.r=S.days[+b.dataset.day].r;C.eat=S.days[+b.dataset.day].time||S.mealTime;C.i=0;C.end=null;renderCook();return}
  else if(a==='cook'){C.open=true;C.r=b.dataset.r;C.eat=S.mealTime;C.i=0;C.end=null;renderCook();return}
  else if(a==='rsel'){S.sel=b.dataset.r;S.selOpen=true}
  else if(a==='rback')S.selOpen=false;
  else if(a==='rfilter')S.rFilter=b.dataset.k;
  else if(a==='port')S.portions=Math.max(1,Math.min(10,S.portions+ +b.dataset.d));
  else if(a==='toList'){const r=S.recipes[b.dataset.r];r.ing.filter(([,,n])=>!S.pantry.some(p=>p.name===n)).forEach(([am,u,n,z])=>S.shop.push({id:Date.now()+Math.random(),name:n,amt:`${fmtF(Math.round(am*S.portions*10)/10)} ${u}`,store:'Aldi Süd',zone:z,price:0,qty:1}));return toast('Fehlende Zutaten auf der Einkaufsliste')}
  else if(a==='tick'){const i=S.shop.find(x=>x.id==b.dataset.id);i.done=!i.done}
  else if(a==='split')S.split=b.dataset.v==='1';
  else if(a==='buy'){const p=S.pantry.splice(+b.dataset.k,1)[0];S.shop.push({id:Date.now(),name:p.name,amt:p.amt,store:'Aldi Süd',zone:p.zone,price:p.price,qty:1});return toast(`${p.name} kommt doch auf die Liste`)}
  else if(a==='crate')S.emptyCrates=Math.max(0,S.emptyCrates+ +b.dataset.d);
  else if(a==='bottle')S.emptyBottles=Math.max(0,S.emptyBottles+ +b.dataset.d);
  else if(a==='toast')return toast(b.dataset.t);
  else if(a==='voter')S.vote.voter=b.dataset.m;
  else if(a==='swipe')return castVote(+b.dataset.d);
  else if(a==='vreset')S.vote.queue=['pizza','makka','tortellini','friss','schnitzel'];
  else if(a==='ai')return blitz();
  else if(a==='scan'){SCAN.open=true;SCAN.msg='';renderScan();return}
  else if(a==='scanclose'){SCAN.open=false;renderScan();return}
  else if(a==='ean'){const c=$('#ean').value.trim();if(c)lookupEan(c);return}
  else if(a==='cookclose'){C.open=false;stopVoice();stopGesture();renderCook();return}
  else if(a==='cnext'){cookMove(1);return}
  else if(a==='cprev'){cookMove(-1);return}
  else if(a==='timer'){C.end=Date.now()+ +b.dataset.m*60000;C.paused=null;renderCook();return}
  else if(a==='pause'){togglePause();return}
  else if(a==='voice'){C.voice?stopVoice():startVoice();renderCook();return}
  else if(a==='gesture'){C.gesture?(stopGesture(),renderCook()):startGesture();return}
  render();
});
document.addEventListener('input',e=>{
  const t=e.target.dataset.input;if(!t)return;
  if(t==='rq'){S.rq=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('[data-input="rq"]');i.focus();i.setSelectionRange(pos,pos)}
  if(t==='zoom'){S.bon.zoom=+e.target.value;document.querySelector('.receipt').style.transform=`scale(${S.bon.zoom})`}
  if(t==='cat'){S.bon.rows[+e.target.dataset.k][2]=e.target.value;render()}
});
/* Namen erst beim Verlassen des Feldes übernehmen, damit der Cursor beim Tippen nicht springt */
document.addEventListener('change',e=>{
  if(e.target.dataset.change==='dtime'){const d=S.days[+e.target.dataset.day];d.time=e.target.value&&e.target.value!==S.mealTime?e.target.value:undefined;return render()}
  if(e.target.dataset.change==='deftime'){if(e.target.value)S.mealTime=e.target.value;return render()}
  if(e.target.dataset.change!=='mname')return;
  const m=S.members.find(x=>x.id===e.target.dataset.m);const v=e.target.value.trim();
  if(m&&v){m.name=v;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.change==='mname')e.target.blur()});
document.addEventListener('keydown',e=>{if(!C.open)return;if(e.key==='ArrowRight')cookMove(1);if(e.key==='ArrowLeft')cookMove(-1);if(e.key===' '){e.preventDefault();togglePause()}});

/* Drag & Drop: Tage tauschen (Gericht wandert, Personen bleiben beim Tag) */
function bindDrag(){
  document.querySelectorAll('.day[draggable]').forEach(el=>{
    el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.day)};
    el.ondragover=e=>{e.preventDefault();el.classList.add('over')};
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{e.preventDefault();const a=+e.dataTransfer.getData('text/plain'),b=+el.dataset.day;if(a===b)return render();const t=S.days[a].r;S.days[a].r=S.days[b].r;S.days[b].r=t;toast(`${S.days[a].d} ⇄ ${S.days[b].d} getauscht`)};
  });
}

/* Swipe-Karte */
function castVote(d){
  const v=S.vote;const id=v.queue.shift();if(!id)return render();
  (v.ballots[v.voter]=v.ballots[v.voter]||{})[id]=d;
  const yes=Object.values(v.ballots).filter(b=>b[id]===1||b[id]===2).length;
  if(yes>=3)return toast(`Meal-Match! „${S.recipes[id].name}“ kommt nächste Woche bevorzugt in den Plan`);
  if(d===2)return toast('⭐ Als Wunschgericht gemerkt');
  render();
}
function bindSwipe(){
  const c=$('#vcard');if(!c)return;let sx=0,sy=0,dx=0,dy=0,down=false;
  const stamp=(id,o)=>{const s=$('#'+id);if(s)s.style.opacity=o};
  c.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('dragging')};
  c.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;stamp('st-yes',Math.max(0,dx/120));stamp('st-no',Math.max(0,-dx/120));stamp('st-up',Math.max(0,-dy/120))};
  c.onpointerup=()=>{down=false;c.classList.remove('dragging');
    const d=dy<-110&&Math.abs(dy)>Math.abs(dx)?2:dx>110?1:dx<-110?-1:0;
    if(!d){c.style.transform='';['st-yes','st-no','st-up'].forEach(s=>stamp(s,0));dx=dy=0;return}
    c.style.transform=d===2?'translateY(-140%)':`translateX(${d*140}%) rotate(${d*20}deg)`;setTimeout(()=>castVote(d),220);dx=dy=0};
}

/* KI-Blitzrezept: echter Aufruf an den PC-Helfer, sonst Beispielantwort */
async function blitz(){
  const red=S.waste.filter(w=>w.lvl==='r').map(w=>w.name+' ('+w.amt+')').join(', ');
  S.aiBusy=true;S.aiResult=null;render();
  try{
    const r=await fetch('http://127.0.0.1:8093/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:'Du bist ein Familienkoch. Schlage EIN Gericht für 4 Personen vor, das in 15 Minuten fertig ist und diese Reste verbraucht. Kurz: Name, Zutaten, 4 Schritte. Deutsch.',messages:[{role:'user',content:'Reste, die heute weg müssen: '+red}]})});
    if(!r.ok)throw new Error();const j=await r.json();S.aiResult=j.text.replace(/\*\*/g,'')+'\n\n(lokal erzeugt mit '+j.model+')';
  }catch(e){
    S.aiResult='Beispielantwort (PC-Helfer nicht erreichbar):\n\nHack-Pfanne mit Crème fraîche und Nudeln\n• 250 g Hackfleisch, 150 g Crème fraîche, 300 g Makkaroni, 1 Zwiebel\n1. Makkaroni kochen.\n2. Hack mit Zwiebel krümelig braten.\n3. Crème fraîche einrühren, abschmecken.\n4. Mit den Nudeln mischen.';
  }
  S.aiBusy=false;render();
}

/* ---------- Viewport-Umschalter ---------- */
const HEIGHT={390:844,820:1180,1440:900,2560:1080};
function setVp(w){
  const stage=$('#stage');const avail=stage.clientWidth-32;
  const width=w==='fit'?Math.max(360,avail):w;const height=w==='fit'?Math.max(600,window.innerHeight-90):HEIGHT[w];
  S.vp=width;const dev=$('#device');dev.style.width=width+'px';dev.style.height=height+'px';
  const availH=window.innerHeight-90;const scale=Math.min(1,avail/width,availH/height);
  const wrap=$('#wrap');wrap.style.transform=`scale(${scale})`;wrap.style.width=width*scale+'px';wrap.style.height=height*scale+'px';
  const cls=width<768?'Mobile · 1 Spalte, Tab-Leiste':width<1200?'Tablet · Slim-Sidebar, Inspektor als Drawer':width<1920?'Desktop · 3 Zonen':'Ultrawide · 4 Spalten';
  $('#vpinfo').textContent=`${width} px · ${cls}${scale<1?` · Vorschau ${Math.round(scale*100)} %`:''}`;
  document.querySelectorAll('[data-vp]').forEach(b=>b.classList.toggle('on',b.dataset.vp==String(w)));
  /* Beim Gerätewechsel ohne Animation, sonst rutscht der Inspektor sichtbar durchs Bild */
  const ins=$('#inspector');ins.style.transition='none';
  S.drawer=false;render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ins.style.transition=''}));
}
document.querySelectorAll('[data-vp]').forEach(b=>b.addEventListener('click',()=>setVp(b.dataset.vp==='fit'?'fit':+b.dataset.vp)));
let lastVp=1440;document.querySelectorAll('[data-vp]').forEach(b=>b.addEventListener('click',()=>lastVp=b.dataset.vp==='fit'?'fit':+b.dataset.vp));
window.addEventListener('resize',()=>setVp(lastVp));
setVp(1440);
</script>
