<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Web-App auf dem iPhone: „Teilen → Zum Home-Bildschirm" startet ohne Safari-Leisten, immer dunkel -->
    <meta name="theme-color" content="#111513" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wochenplan" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #111513;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      input, textarea { font-size: 16px; } /* verhindert das Hineinzoomen auf dem iPhone */
      body, div, input, textarea { font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      [role="button"], [role="tab"], [role="checkbox"], [role="link"] { cursor: pointer; transition: background-color .15s ease, border-color .15s ease, transform .1s ease; }
      [role="button"]:active { transform: scale(.985); }
      :focus-visible { outline: 2px solid #5FBF85; outline-offset: 2px; border-radius: 10px; }
      input:focus, textarea:focus { outline: none; border-color: #5FBF85 !important; box-shadow: 0 0 0 3px rgba(95,191,133,.18); }
      ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #242C28; border-radius: 10px; }
    </style>
  </head>

  <body>
    <noscript>Bitte JavaScript einschalten.</noscript>
    <div id="root"></div>
  </body>
</html>
